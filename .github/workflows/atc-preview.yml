name: At Home Cards preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:cards
      - uses: actions/upload-artifact@v4
        with:
          name: at-home-cards-preview-${{ github.sha }}
          path: build/at-home-cards/at-home-cards.js
          if-no-files-found: error
